name: Refresh Search Index

on:
  schedule:
    - cron: "0 8 * * 0" # every Sunday at 8:00 UTC
  workflow_dispatch:

jobs:
  create-search-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Run create_search_index notebook
        run: |
          jupyter nbconvert --to notebook --execute dev_tools/create_search_index.ipynb --inplace

      - name: Commit updated search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update search index"
          git push
